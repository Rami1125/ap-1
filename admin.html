<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>הזמנה חדשה - ח.סבן</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0c5b9e;
            --secondary: #ff9900;
            --bg-main: #f0f2f5;
            --text-dark: #1a202c;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
        }
        body { font-family: 'Assistant', sans-serif; background-color: var(--bg-main); }
        .page { display: none; animation: fadeIn 0.5s; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .toast {
            position: fixed; bottom: -100px; left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px; border-radius: 8px; color: white;
            font-weight: 600; z-index: 1000; transition: all 0.5s ease;
        }
        .toast.show { bottom: 20px; }
        .toast.success { background-color: #28a745; }
        .toast.error { background-color: #dc3545; }
        #autocomplete-results { max-height: 200px; overflow-y: auto; }
        .progress-bar { transition: width 0.5s ease-in-out; }
    </style>
</head>
<body class="max-w-md mx-auto bg-card-bg min-h-screen">

    <div id="app-container">
        <!-- Loading Screen -->
        <div id="page-loading" class="page active flex items-center justify-center h-screen">
            <div class="text-center">
                <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-primary mx-auto"></div>
                <p class="mt-4 text-lg font-semibold text-text-dark">טוען נתונים...</p>
            </div>
        </div>
        
        <!-- Order Form Page -->
        <div id="page-order-form" class="page p-4 pb-28">
            <header class="text-center py-4 border-b border-border-color">
                <img src="https://i.postimg.cc/CMsm57QV/image.png" alt="לוגו" class="h-16 mx-auto mb-2 rounded-lg">
                <p class="text-lg">הזמנה חדשה עבור <span id="customer-name" class="font-bold"></span></p>
                <p class="text-gray-500" id="project-name"></p>
            </header>

            <main class="mt-6 space-y-6">
                <!-- Smart Product Input -->
                <div class="relative">
                    <label for="product-search" class="font-semibold text-gray-700">1. הוסף מוצרים</label>
                    <input type="text" id="product-search" placeholder="הקלד שם מוצר..." class="w-full p-3 mt-1 border border-border-color rounded-lg text-lg focus:ring-2 focus:ring-primary">
                    <div id="autocomplete-results" class="absolute z-10 w-full bg-white border border-border-color rounded-b-lg mt-1 hidden shadow-lg"></div>
                </div>

                <!-- Pasted List Textarea -->
                 <textarea id="paste-area" placeholder="או הדבק כאן רשימת מוצרים (כל מוצר בשורה חדשה)" class="w-full p-3 border border-border-color rounded-lg h-24"></textarea>

                <!-- Order Items List -->
                <div>
                    <h2 class="font-semibold text-gray-700 mb-2">2. פרטי ההזמנה</h2>
                    <div id="order-items-container" class="space-y-3">
                        <p class="text-center text-gray-400 py-4">הפריטים שנוספו להזמנה יופיעו כאן</p>
                    </div>
                </div>
            </main>

            <footer class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-white p-4 border-t border-border-color">
                 <div class="w-full bg-gray-200 rounded-full h-2.5 mb-4">
                    <div id="progress-bar" class="bg-primary h-2.5 rounded-full progress-bar" style="width: 0%"></div>
                </div>
                <button id="submit-order-btn" class="w-full bg-primary text-white font-bold py-3 rounded-lg hover:opacity-90 transition disabled:opacity-50" disabled>שלח בקשה למנהל</button>
            </footer>
        </div>
    </div>
    <div id="toast-container"></div>

    <script>
        // --- CONFIGURATION ---
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx07zliATi8KaNVWALPQugtzCsuJ1CojF_N8-6wUE3AKY18Lho66XZplGSf8v2xdaVf/exec";

        // --- GLOBAL STATE ---
        let currentCustomer = null;
        let productCatalog = [];
        let orderItems = []; // [{ name: '...', quantity: 1, sku: '...' }, ...]

        // --- DOM ELEMENTS ---
        const dom = {
            loadingPage: document.getElementById('page-loading'),
            orderFormPage: document.getElementById('page-order-form'),
            customerName: document.getElementById('customer-name'),
            projectName: document.getElementById('project-name'),
            productSearch: document.getElementById('product-search'),
            autocompleteResults: document.getElementById('autocomplete-results'),
            pasteArea: document.getElementById('paste-area'),
            orderItemsContainer: document.getElementById('order-items-container'),
            submitOrderBtn: document.getElementById('submit-order-btn'),
            progressBar: document.getElementById('progress-bar'),
        };

        // --- API HELPER ---
        async function apiCall(action, data) {
            const payload = { action, ...data };
            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST', mode: 'cors', body: JSON.stringify(payload),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, redirect: 'follow'
                });
                return await response.json();
            } catch (error) {
                console.error("API Call Error:", error);
                return { status: 'error', message: 'שגיאת תקשורת עם השרת.' };
            }
        }

        // --- CORE APP LOGIC ---
        async function initApp() {
            const urlParams = new URLSearchParams(window.location.search);
            const customerId = urlParams.get('customerId');
            if (!customerId) {
                document.body.innerHTML = '<p class="text-center text-red-500 p-10">שגיאה: מספר לקוח לא סופק.</p>';
                return;
            }

            try {
                const [loginResult, catalogData] = await Promise.all([
                    apiCall('login', { customerId }),
                    fetch(`${SCRIPT_URL}?sheet=קטלוג מוצרים`).then(res => res.json())
                ]);

                if (loginResult.status !== 'success') throw new Error(loginResult.message);
                currentCustomer = loginResult.user;
                productCatalog = catalogData;

                dom.customerName.textContent = currentCustomer['שם לקוח'];
                dom.projectName.textContent = `לפרויקט: ${currentCustomer['פרוייקט'] || 'כללי'}`;
                
                setupEventListeners();
                navigateTo('page-order-form');
            } catch (error) {
                console.error("Initialization error:", error);
                document.body.innerHTML = `<p class="text-center text-red-500 p-10">שגיאה בטעינת הנתונים: ${error.message}</p>`;
            }
        }

        function navigateTo(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
        }

        // --- SMART FORM LOGIC ---
        function handleSearchInput() {
            const query = dom.productSearch.value.toLowerCase();
            if (query.length < 2) {
                dom.autocompleteResults.innerHTML = '';
                dom.autocompleteResults.classList.add('hidden');
                return;
            }
            const results = productCatalog.filter(p => p['שם מוצר'].toLowerCase().includes(query)).slice(0, 5);
            dom.autocompleteResults.innerHTML = results.map(p => 
                `<div class="p-3 hover:bg-gray-100 cursor-pointer" data-sku="${p['מק"ט']}">${p['שם מוצר']}</div>`
            ).join('');
            dom.autocompleteResults.classList.remove('hidden');
        }

        function addProductToOrder(sku) {
            const product = productCatalog.find(p => String(p['מק"ט']) === String(sku));
            if (product && !orderItems.some(item => item.sku === sku)) {
                orderItems.push({ name: product['שם מוצר'], quantity: 1, sku: sku });
                renderOrderItems();
            }
            dom.productSearch.value = '';
            dom.autocompleteResults.classList.add('hidden');
            updateProgress();
        }

        function handlePaste(event) {
            event.preventDefault();
            const pastedText = (event.clipboardData || window.clipboardData).getData('text');
            const lines = pastedText.split('\n').filter(line => line.trim() !== '');
            
            lines.forEach(line => {
                const trimmedLine = line.trim().toLowerCase();
                const foundProduct = productCatalog.find(p => p['שם מוצר'].toLowerCase().includes(trimmedLine));
                if (foundProduct) {
                    addProductToOrder(foundProduct['מק"ט']);
                }
            });
            dom.pasteArea.value = '';
            showToast(`${lines.length} שורות הודבקו, נוספו מוצרים שנמצאו.`, 'success');
        }

        function renderOrderItems() {
            if (orderItems.length === 0) {
                dom.orderItemsContainer.innerHTML = '<p class="text-center text-gray-400 py-4">הפריטים שנוספו להזמנה יופיעו כאן</p>';
                return;
            }
            dom.orderItemsContainer.innerHTML = orderItems.map((item, index) => `
                <div class="bg-blue-50 p-3 rounded-lg flex items-center justify-between animate-fade-in">
                    <p class="font-semibold text-text-dark">${item.name}</p>
                    <div class="flex items-center space-x-2 space-x-reverse">
                        <label class="text-sm">כמות:</label>
                        <input type="number" value="${item.quantity}" min="1" data-index="${index}" class="w-16 text-center border rounded-md p-1 item-quantity">
                        <button data-index="${index}" class="text-red-500 hover:text-red-700 p-1 remove-item-btn text-xl font-bold">&times;</button>
                    </div>
                </div>
            `).join('');
            updateProgress();
        }

        function updateProgress() {
            const hasItems = orderItems.length > 0;
            dom.submitOrderBtn.disabled = !hasItems;
            dom.progressBar.style.width = hasItems ? '100%' : '0%';
        }
        
        async function submitOrder() {
            dom.submitOrderBtn.disabled = true;
            dom.submitOrderBtn.textContent = 'שולח בקשה...';
            dom.progressBar.classList.add('animate-pulse');

            const orderDetails = {
                customerNumber: currentCustomer['מספר לקוח'],
                customerName: currentCustomer['שם לקוח'],
                projectName: currentCustomer['פרוייקט'] || 'כללי',
                deliveryAddress: currentCustomer['כתובת'] || 'לא צוין',
                itemNames: orderItems.map(item => item.name).join('||'),
                itemQuantities: orderItems.map(item => item.quantity).join('||'),
                notes: ''
            };

            try {
                const result = await apiCall('submitMaterialOrder', { orderDetails });
                if (result.status !== 'success' || !result.whatsappUrl) {
                    throw new Error(result.message || 'שגיאה לא ידועה מהשרת');
                }
                
                showToast('הבקשה נשלחה למנהל!', 'success');
                window.open(result.whatsappUrl, '_blank');
                
                // Reset form
                orderItems = [];
                renderOrderItems();
            } catch (error) {
                console.error("Error submitting order:", error);
                showToast(`שגיאה בשליחת ההזמנה: ${error.message}`, 'error');
            } finally {
                dom.submitOrderBtn.disabled = false;
                dom.submitOrderBtn.textContent = 'שלח בקשה למנהל';
                dom.progressBar.classList.remove('animate-pulse');
                updateProgress();
            }
        }
        
        // --- EVENT LISTENERS & HELPERS ---
        function setupEventListeners() {
            dom.productSearch.addEventListener('input', handleSearchInput);
            dom.autocompleteResults.addEventListener('click', (e) => {
                if (e.target.dataset.sku) {
                    addProductToOrder(e.target.dataset.sku);
                }
            });
            dom.pasteArea.addEventListener('paste', handlePaste);
            dom.orderItemsContainer.addEventListener('change', e => {
                if (e.target.classList.contains('item-quantity')) {
                    const index = parseInt(e.target.dataset.index);
                    const newQuantity = parseInt(e.target.value);
                    if (!isNaN(index) && newQuantity > 0) {
                        orderItems[index].quantity = newQuantity;
                    }
                }
            });
            dom.orderItemsContainer.addEventListener('click', e => {
                 if (e.target.classList.contains('remove-item-btn')) {
                    const index = parseInt(e.target.dataset.index);
                    orderItems.splice(index, 1);
                    renderOrderItems();
                }
            });
            dom.submitOrderBtn.addEventListener('click', submitOrder);
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`; toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => {
                toast.classList.remove('show');
                toast.addEventListener('transitionend', () => toast.remove());
            }, 3000);
        }

        // --- START THE APP ---
        window.onload = initApp;

    </script>
</body>
</html>
