<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ח. סבן | ניהול הזמנות</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="manifest.json">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    
    <style>
        :root {
            --whatsapp-teal-green: #128C7E;
            --whatsapp-teal-green-dark: #075E54;
            --whatsapp-light-green: #25D366;
            --whatsapp-light-gray: #ECE5DD;
            --whatsapp-message-bg: #DCF8C6;
            --whatsapp-white: #FFFFFF;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            overscroll-behavior-y: contain;
        }
        #app-container {
            background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png');
            background-color: var(--whatsapp-light-gray);
        }
        .whatsapp-header { background-color: var(--whatsapp-teal-green-dark); }
        .whatsapp-send-button { background-color: var(--whatsapp-teal-green); }
        .message-out { background-color: var(--whatsapp-message-bg); }
        .message-in { background-color: var(--whatsapp-white); }
        .progress-bar-animated { animation: progress-animation 1.5s ease-out forwards; }
        @keyframes progress-animation { from { width: 0%; } }
    </style>
</head>
<body class="bg-gray-800 flex items-center justify-center min-h-screen">

    <div class="w-full max-w-md mx-auto h-[95vh] bg-white rounded-2xl shadow-2xl flex flex-col overflow-hidden">

        <!-- Loading Spinner -->
        <div id="loading-spinner" class="hidden absolute inset-0 bg-white bg-opacity-80 flex items-center justify-center z-50">
            <svg class="animate-spin h-10 w-10 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
        </div>
        
        <!-- Login Screen -->
        <div id="login-screen" class="flex flex-col items-center justify-center h-full p-8 text-center bg-gray-50">
            <img src="https://i.ibb.co/6P9G2kq/transperent.png" alt="ח. סבן לוגו" class="w-32 h-32 mb-4">
            <h1 class="text-3xl font-bold text-gray-800 mb-2">ברוכים הבאים</h1>
            <p class="text-gray-600 mb-8">מערכת ניהול הזמנות חכמה</p>
            <input type="tel" id="customer-id-input" placeholder="הזן מספר לקוח" class="w-full p-4 text-center rounded-lg border-2 border-gray-300 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition duration-300">
            <button id="login-button" class="w-full bg-blue-600 text-white font-bold py-4 rounded-lg mt-4 hover:bg-blue-700 transition duration-300 shadow-lg">כניסה</button>
            <p id="login-error" class="text-red-500 mt-4 h-4"></p>
        </div>

        <!-- Main App Screen (Order List) -->
        <div id="main-app-screen" class="hidden h-full flex flex-col">
            <header class="whatsapp-header text-white p-4 flex justify-between items-center shadow-md z-10">
                <div class="flex items-center">
                    <img id="user-avatar" src="" alt="User Avatar" class="w-10 h-10 rounded-full object-cover">
                    <h2 id="user-name" class="text-lg font-semibold mr-3"></h2>
                </div>
                <div class="flex space-x-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                </div>
            </header>
            <div id="order-list" class="flex-1 overflow-y-auto bg-white"></div>
        </div>

        <!-- Chat Screen -->
        <div id="chat-screen" class="hidden h-full flex flex-col" style="background-color: var(--whatsapp-light-gray);">
            <!-- Chat Header -->
            <header class="whatsapp-header text-white p-3 flex items-center shadow-md z-10">
                <button id="back-to-main-button" class="text-white p-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
                </button>
                <div class="mr-3">
                    <h2 id="chat-title" class="text-lg font-semibold"></h2>
                    <p id="chat-status" class="text-xs text-gray-200"></p>
                </div>
                 <div class="flex-grow"></div>
                 <button id="edit-order-button" class="text-white p-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg>
                 </button>
            </header>

            <div id="message-area" class="flex-1 overflow-y-auto p-4 space-y-2">
                 <!-- Bot Welcome Message -->
                 <div class="p-3 rounded-lg max-w-sm mx-auto bg-yellow-100 text-yellow-800 text-center text-sm shadow">
                    <p>ניתן להדביק כאן רשימת מוצרים לא מסודרת, והמערכת תנתח ותסדר אותה עבורך.</p>
                 </div>
            </div>

            <footer class="bg-gray-100 p-2 flex items-center">
                 <input type="text" id="message-input" placeholder="הקלד/י הזמנה..." class="flex-1 p-3 rounded-full border-2 border-gray-300 focus:outline-none focus:border-blue-500 mx-2">
                 <button id="send-button" class="whatsapp-send-button text-white p-3 rounded-full hover:opacity-90 transition-transform transform hover:scale-110">
                     <svg xmlns="http://www.w.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
                 </button>
            </footer>
        </div>
    </div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    // --- IMPORTANT: DEPLOY YOUR GOOGLE APPS SCRIPT AND PASTE THE WEB APP URL HERE ---
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbyVD-GR9t4woEzYSaI0f6xHarNoM84qGMVkD8qMSTFzdx30AaNvZ9jzu6yoALu3j621tQ/exec'; 

    const dom = {
        loginScreen: document.getElementById('login-screen'),
        mainAppScreen: document.getElementById('main-app-screen'),
        chatScreen: document.getElementById('chat-screen'),
        loginButton: document.getElementById('login-button'),
        customerIdInput: document.getElementById('customer-id-input'),
        loginError: document.getElementById('login-error'),
        orderList: document.getElementById('order-list'),
        backToMainButton: document.getElementById('back-to-main-button'),
        userName: document.getElementById('user-name'),
        userAvatar: document.getElementById('user-avatar'),
        chatTitle: document.getElementById('chat-title'),
        chatStatus: document.getElementById('chat-status'),
        messageArea: document.getElementById('message-area'),
        loadingSpinner: document.getElementById('loading-spinner'),
    };

    let state = {
        currentUser: null,
        currentOrders: [],
    };

    function showSpinner(show) {
        dom.loadingSpinner.classList.toggle('hidden', !show);
    }

    async function apiCall(action, params = {}, method = 'GET', body = null) {
        if (WEB_APP_URL === 'YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE') {
            alert('נא להגדיר את כתובת ה-WebApp של Google Apps Script בקוד.');
            return { status: 'error', message: 'WebApp URL not configured' };
        }
        
        showSpinner(true);
        let url = `${WEB_APP_URL}?action=${action}`;
        if (method === 'GET') {
            Object.keys(params).forEach(key => url += `&${key}=${encodeURIComponent(params[key])}`);
        }
        
        try {
            const options = { method };
            if (method === 'POST') {
                options.body = JSON.stringify(body);
                options.headers = { 'Content-Type': 'text/plain;charset=utf-8' }; // Required for Apps Script
            }
            const response = await fetch(url, options);
            if (!response.ok) throw new Error('Network response was not ok.');
            const data = await response.json();
            return data;
        } catch (error) {
            console.error('API Call Error:', error);
            return { status: 'error', message: error.message };
        } finally {
            showSpinner(false);
        }
    }

    const handleLogin = async () => {
        const customerId = dom.customerIdInput.value.trim();
        if (!customerId) {
            dom.loginError.textContent = 'יש להזין מספר לקוח.';
            return;
        }
        dom.loginError.textContent = '';

        const result = await apiCall('login', { customerId });
        if (result.status === 'success') {
            state.currentUser = result.data;
            dom.userName.textContent = state.currentUser.name;
            dom.userAvatar.src = state.currentUser.avatar;
            
            dom.loginScreen.classList.add('hidden');
            dom.mainAppScreen.classList.remove('hidden');
            dom.mainAppScreen.classList.add('flex');
            loadOrders();
        } else {
            dom.loginError.textContent = result.message || 'Login failed';
        }
    };

    const loadOrders = async () => {
        dom.orderList.innerHTML = '<p class="text-center p-8 text-gray-500">טוען הזמנות...</p>';
        const result = await apiCall('getOrders', { customerId: state.currentUser.id });
        if (result.status === 'success') {
            state.currentOrders = result.data;
            renderOrders();
        } else {
            dom.orderList.innerHTML = `<p class="text-center p-8 text-red-500">${result.message}</p>`;
        }
    };
    
    const renderOrders = () => {
        dom.orderList.innerHTML = '';
        if (state.currentOrders.length === 0) {
            dom.orderList.innerHTML = '<p class="text-center p-8 text-gray-500">אין הזמנות פעילות.</p>';
            return;
        }

        state.currentOrders.forEach(order => {
            const orderElement = document.createElement('div');
            orderElement.className = 'flex items-start p-3 hover:bg-gray-50 cursor-pointer border-b border-gray-200';
            orderElement.onclick = () => showChatScreen(order);
            
            let progressBarHTML = '';
            if (order.type === 'container' && order.startDate) {
                const startDate = new Date(order.startDate);
                const daysPassed = Math.max(0, Math.round((new Date() - startDate) / (1000 * 60 * 60 * 24)));
                const progress = Math.min((daysPassed / order.rentalDays) * 100, 100);
                progressBarHTML = `
                    <div class="mt-2">
                        <span class="text-xs text-gray-500">${daysPassed} / ${order.rentalDays} ימים</span>
                        <div class="w-full bg-gray-200 rounded-full h-1.5 mt-1">
                            <div class="bg-blue-500 h-1.5 rounded-full progress-bar-animated" style="width: ${progress}%"></div>
                        </div>
                    </div>`;
            }

            orderElement.innerHTML = `
                <img src="https://placehold.co/50x50/128C7E/FFFFFF?text=${order.projectName.charAt(0)}" alt="Project Avatar" class="w-12 h-12 rounded-full object-cover mt-1">
                <div class="flex-1 mr-4">
                    <div class="flex justify-between items-center">
                        <h3 class="font-semibold text-gray-800">${order.projectName}</h3>
                        <span class="text-xs text-gray-500">${order.timestamp}</span>
                    </div>
                    <p class="text-sm text-gray-600 truncate">${order.lastMessage}</p>
                    ${progressBarHTML}
                </div>`;
            dom.orderList.appendChild(orderElement);
        });
    };

    const showChatScreen = (order) => {
        dom.chatTitle.textContent = order.projectName;
        dom.chatStatus.textContent = order.status;
        dom.messageArea.innerHTML = ''; // Clear previous messages
        
        // Add welcome bubble again
        dom.messageArea.innerHTML = `<div class="p-3 rounded-lg max-w-sm mx-auto bg-yellow-100 text-yellow-800 text-center text-sm shadow"><p>זוהי שיחה חדשה. ניתן לשאול שאלות על מוצרים, או להדביק רשימת הזמנה.</p></div>`;

        dom.mainAppScreen.classList.add('hidden');
        dom.mainAppScreen.classList.remove('flex');
        dom.chatScreen.classList.remove('hidden');
        dom.chatScreen.classList.add('flex');
    };

    const showMainScreen = () => {
        dom.chatScreen.classList.add('hidden');
        dom.chatScreen.classList.remove('flex');
        dom.mainAppScreen.classList.remove('hidden');
        dom.mainAppScreen.classList.add('flex');
    };

    dom.loginButton.addEventListener('click', handleLogin);
    dom.customerIdInput.addEventListener('keypress', (e) => e.key === 'Enter' && handleLogin());
    dom.backToMainButton.addEventListener('click', showMainScreen);
});
</script>

</body>
</html>
